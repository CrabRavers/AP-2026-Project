[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["common"]

[workspace.dependencies]
common = { package = "ap-2026-common-code", path = "common" }
crossbeam-channel = "0.5"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
